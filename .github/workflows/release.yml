name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install
          npm run lint
          npm test
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          previous_tag="$(git tag --sort=-version:refname | grep -Fxv "$tag" | head -n 1)"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${tag}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes="Full Changelog: ${compare_url}" \
            main.js manifest.json styles.css
